# FARNÍ AGENDA - CI (GitHub Actions)
# Spouští se na push do main/master a na pull requesty.
# Krok: TypeScript check → Jest testy → ESLint → next build.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # Placeholder env pro build (reálné klíče v Supabase; build je statický)
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      GOOGLE_CLIENT_ID: placeholder-client-id
      GOOGLE_CLIENT_SECRET: placeholder-client-secret
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests (Jest)
        run: npx jest --silent

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (Next.js)
        run: npm run build
